## File Browser Quantum over /srv/files, as uid 1000 like Syncthing.
## Login is Keycloak (realm kcfam): users are matched by preferred_username and
## must have login method "oidc"; `admins` members get admin. Password login is
## off; break-glass is enabling it and logging in as `admin`, a local password
## user reset to FILEBROWSER_ADMIN_PASSWORD on every start. The two per-user sources are off for new users; access is
## granted per user in Settings -> Users (stkchristy: stkchristy and shared), with
## per-source file permissions. Users, scopes and the token signing key live in
## data/filebrowser.sqlite; data/database.db is the v1 BoltDB it was migrated from.
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebrowser
  namespace: home
data:
  config.yaml: |
    http:
      port: 80
      trustProxyHeaders: true
    server:
      database:
        path: /home/filebrowser/data/filebrowser.sqlite
        migrateFrom: /home/filebrowser/data/database.db
      logging:
        - levels: "info|warning|error"
      sources:
        - path: /srv/files/maxtkc
          name: maxtkc
          config:
            defaultEnabled: false
            defaultPermissions: { view: true, download: true, modify: true, create: true, delete: true }
        - path: /srv/files/stkchristy
          name: stkchristy
          config:
            defaultEnabled: false
            defaultPermissions: { view: true, download: true, modify: true, create: true, delete: true }
        - path: /srv/files/shared
          name: shared
          config:
            defaultEnabled: true
            defaultPermissions: { view: true, download: true, modify: true, create: true, delete: true }
    auth:
      adminUsername: admin
      methods:
        password:
          enabled: false
          minLength: 8
          signup: false
        oidc:
          enabled: true
          clientId: filebrowser
          issuerUrl: https://id.kcfam.us/realms/kcfam
          scopes: openid email profile
          userIdentifier: preferred_username
          groupsClaim: groups
          adminGroup: admins
          userGroups: [family]
          logoutRedirectUrl: https://id.kcfam.us/realms/kcfam/protocol/openid-connect/logout
    userDefaults:
      account:
        permissions:
          api: false
          admin: false
          share: true
          realtime: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: filebrowser-data
  namespace: home
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  namespace: home
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
      annotations:
        # Restart on config change; bump with the ConfigMap.
        config-revision: "4"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: filebrowser
          image: gtstef/filebrowser:2.0.1-stable
          env:
            - name: FILEBROWSER_CONFIG
              value: /home/filebrowser/config/config.yaml
            - name: FILEBROWSER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: files
                  key: FILEBROWSER_ADMIN_PASSWORD
            - name: FILEBROWSER_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: files
                  key: FILEBROWSER_OIDC_CLIENT_SECRET
            - name: TZ
              value: America/New_York
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - { name: config, mountPath: /home/filebrowser/config, readOnly: true }
            - { name: data, mountPath: /home/filebrowser/data }
            - { name: files, mountPath: /srv/files }
      volumes:
        - name: config
          configMap:
            name: filebrowser
        - name: data
          persistentVolumeClaim:
            claimName: filebrowser-data
        - name: files
          hostPath: { path: /srv/files, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: filebrowser
  namespace: home
spec:
  selector:
    app: filebrowser
  ports:
    - port: 80
